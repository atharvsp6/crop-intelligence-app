version: '3.8'

services:
  # Main API Gateway
  api:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: crop-intelligence-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DISEASE_SERVICE_URL=http://disease-service:8001
      - YIELD_SERVICE_URL=http://yield-service:8002
    env_file:
      - ./backend-fastapi/.env
    depends_on:
      - disease-service
      - yield-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - crop-network

  # Disease Detection AI Service
  disease-service:
    build:
      context: ./ai-services/disease-detection-service
      dockerfile: Dockerfile
    container_name: disease-detection-service
    ports:
      - "8001:8001"
    environment:
      - DEBUG=false
      - DEVICE=cpu
    env_file:
      - ./ai-services/disease-detection-service/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - crop-network
    deploy:
      resources:
        limits:
          memory: 1G

  # Crop Yield Prediction AI Service  
  yield-service:
    build:
      context: ./ai-services/crop-yield-service
      dockerfile: Dockerfile
    container_name: crop-yield-service
    ports:
      - "8002:8002"
    environment:
      - DEBUG=false
    env_file:
      - ./ai-services/crop-yield-service/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - crop-network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  crop-network:
    driver: bridge

volumes:
  model-data:
